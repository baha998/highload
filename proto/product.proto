syntax = "proto3";

package catalog.v1;
option go_package = "example.com/productcatalog/gen/product/v1;productv1";

import "google/protobuf/timestamp.proto";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListCategoryProducts(ListCategoryProductsRequest) returns (ListCategoryProductsResponse);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
}

message Product {
  string id = 1;
  string sku = 2;
  string title = 3;
  string description = 4;
  double price = 5;
  string category_id = 6;
  string brand_id = 7;
  map<string, string> attributes = 8;
  repeated string images = 9;
  int32 in_stock = 10;
  int64 version = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message Category {
  string id = 1;
  string parent_id = 2;
  string name = 3;
}

message Brand {
  string id = 1;
  string name = 2;
}

message GetProductRequest { string id = 1; }
message ListCategoryProductsRequest {
  string category_id = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListCategoryProductsResponse {
  repeated Product products = 1;
  string next_cursor = 2;
}
message CreateProductRequest {
  string sku = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string category_id = 5;
  string brand_id = 6;
  map<string, string> attributes = 7;
  repeated string images = 8;
  int32 in_stock = 9;
}

// Wrappers distinguish an absent collection from an explicitly empty one.
message Attributes { map<string, string> values = 1; }
message Images { repeated string values = 1; }
message ProductChanges {
  optional string sku = 1;
  optional string title = 2;
  optional string description = 3;
  optional double price = 4;
  optional string category_id = 5;
  optional string brand_id = 6;
  Attributes attributes = 7;
  Images images = 8;
  optional int32 in_stock = 9;
}
message UpdateProductRequest {
  string id = 1;
  int64 version = 2;
  ProductChanges changes = 3;
}
